const etiquetaPara = p => D.equipe && PARA[p] ? `<span class="cm-para">${PARA[p]}</span>` : "";
const fotoOuIniciais = (nome, foto, t) => `<span class="av" style="width:${t}px;height:${t}px">${/^data:image\/(png|jpeg|webp);base64,/.test(foto || "") ? `<img src="${esc(foto)}" alt="">` : esc(ini(nome))}</span>`;

/* ── a página ── */
function desenhar() {
  const posts = D.posts || [];
  const planos = posts.filter(p => p.tipo === "plano");
  const resumos = posts.filter(p => p.tipo === "resumo").sort((a, b) => a.dia.localeCompare(b.dia));
  const hoje = hojeIso();
  // o plano da semana de hoje; sem ele, o mais recente que já começou
  const plano = planos.filter(p => p.dia <= hoje).sort((a, b) => b.dia.localeCompare(a.dia))[0] || null;
  const capa = /^data:image\/(png|jpeg|webp);base64,/.test(D.capa || "") ? `<img src="${esc(D.capa)}" alt="Foto da equipe" style="object-position:${Math.min(100, Math.max(0, +D.capa_foco || 50))}% 50%">` : "";
  const logo = /^data:image\/(png|jpeg|webp|svg\+xml);base64,/.test(D.logo || "") ? `<img src="${esc(D.logo)}" alt="Logo">` : `<div class="lg">${esc((D.nome || "C").trim()[0].toUpperCase())}</div>`;
  const nRes = resumos.filter(r => r.dia >= somar(hoje, -1)).length;

  alvo.innerHTML = `
    <div class="cm-capa">${capa}</div>
    <div class="cm-cols">
      <aside>
        <div class="cm-logo">${logo}</div>
        <div class="cm-nome">${esc(D.nome || "Comunidade HOD")}</div>
        <div class="cm-meta">${D.membros ? D.membros + (D.membros === 1 ? " membro" : " membros") : ""}</div>
        <nav class="cm-menu">
          <a class="on" href="#plano">Plano da semana</a><a href="#resumo">Resumo do dia${nRes ? ` <b style="color:var(--amber)">${nRes}</b>` : ""}</a>
          <a href="#forum">Fórum</a><a href="#encontros">Encontros</a><a href="#faq">Perguntas frequentes</a><a href="#forum" data-filtro-menu="material">Materiais</a>
        </nav>
      </aside>
      <div class="cm-meio">
        ${plano ? planoHtml(plano) : `<article class="cm-cx" id="plano"><h2>Plano da semana</h2><p class="cm-vazio">O plano desta semana ainda não foi publicado.</p></article>`}
        <section class="cm-cx" id="resumo">${resumos.length ? "" : `<h2>Resumo do dia</h2><p class="cm-vazio">Nenhum resumo publicado ainda.</p>`}</section>
        <section class="cm-cx cm-forum" id="forum">
          <h2>Fórum</h2>
          <p class="cm-enc-dica">Os resumos de cada dia, os avisos e os materiais ficam guardados aqui. O plano da semana não entra: ele vale só para a semana e é trocado na seguinte. Busque uma palavra para achar o que já foi falado nos grupos.</p>
          <label class="cm-busca"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.3-4.3"/></svg>
            <input id="busca" type="search" placeholder="Buscar no fórum: W-8BEN, TELUS, pagamento, entrevista…" autocomplete="off"></label>
          <div class="cm-forum-chips" id="forumChips"></div>
          <p class="cm-forum-n" id="forumN" aria-live="polite"></p>
          <div id="forumLista"></div>
        </section>
      </div>
      <aside class="cm-dir">
        <section class="cm-cx" id="encontros"><h2>Próximos encontros</h2><p class="cm-enc-dica">Clique num encontro para ver os detalhes e pôr na sua agenda.</p><div id="listaEnc"></div></section>
        <section class="cm-cx cm-faq" id="faq"><h2 style="margin-bottom:2px">Perguntas frequentes</h2>
          <p class="cm-enc-dica">As dúvidas que mais aparecem nos resumos do fórum.</p><div id="faqLista"></div></section>
        ${(D.time || []).length ? `<section class="cm-cx"><h2>Equipe</h2><div class="cm-equipe">${D.time.map(p =>
          `<div>${fotoOuIniciais(p.nome, p.foto, 36)}<span>${esc(p.nome)}<small>${p.dono ? "Administrador" : "Equipe"}</small></span></div>`).join("")}</div></section>` : ""}
      </aside>
    </div>`;

  if (plano) ligarPlano();
  if (resumos.length) resumoDoDia(resumos.slice(-3));
  forum(posts);
  perguntasFrequentes(resumos);
  encontros();
  document.querySelectorAll(".cm-menu a").forEach(a => a.addEventListener("click", () => {
    document.querySelectorAll(".cm-menu a").forEach(b => b.classList.toggle("on", b === a));
    if (a.dataset.filtroMenu) { F.tipo = a.dataset.filtroMenu; forum(posts); }
  }));
}

/* ── plano da semana ── */
function planoHtml(p) {
  const d = p.dados || {}, hoje = hojeIso();
  const fim = somar(p.dia, 6);
  const dias = lista(d.dias).filter(x => x && (x.titulo || x.texto));
  return `<article class="cm-cx cm-semana" id="plano">
    <div class="cm-post-cab"><span class="av">EQ</span><div><b>Equipe Hub${etiquetaPara(p.para)}</b><small>${p.publicado_em ? "postou em " + esc(new Date(p.publicado_em).toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "2-digit" })) : ""}</small></div></div>
    <div class="cm-semana-topo">
      <p class="cm-semana-rot">Plano da semana</p>
      <h2 class="cm-semana-tit">${esc(p.titulo || ddmm(p.dia) + " a " + ddmm(fim))}</h2>
      ${d.meta ? `<p class="cm-semana-meta"><span>Meta da semana</span>${esc(d.meta)}</p>` : ""}
    </div>
    ${d.mensagem ? `<p class="cm-txt cm-semana-msg">${esc(d.mensagem)}</p>` : ""}
    ${dias.length ? `<div class="cm-plano">
      <button class="cm-seta esq" id="setaEsq" aria-label="Dias anteriores">‹</button>
      <div class="cm-trilha" id="trilha">${dias.map(x => {
        const eHoje = x.data === hoje;
        return `<div class="cm-dia${eHoje ? " hoje" : ""}">
          <div class="cab"><span class="dn">${ehData(x.data) ? DSEM[dt(x.data).getDay()] : esc(x.dia || "")}</span><span class="dd">${esc(ddmm(x.data))}</span>${eHoje ? `<span class="hj">Hoje</span>` : ""}</div>
          ${x.titulo ? `<span class="t">${esc(x.titulo)}</span>` : ""}${x.texto ? `<span class="x">${esc(x.texto)}</span>` : ""}${x.quando ? `<span class="q">${esc(x.quando)}</span>` : ""}</div>`;
      }).join("")}</div>
      <button class="cm-seta dir" id="setaDir" aria-label="Próximos dias">›</button></div>` : ""}
  </article>`;
}
function ligarPlano() {
  const trilha = document.getElementById("trilha"); if (!trilha) return;
  const esq = document.getElementById("setaEsq"), dir = document.getElementById("setaDir");
  const passo = () => (trilha.querySelector(".cm-dia") || { offsetWidth: 300 }).offsetWidth + 12;
  esq.onclick = () => trilha.scrollBy({ left: -passo() * 2 });
  dir.onclick = () => trilha.scrollBy({ left: passo() * 2 });
  const setas = () => { esq.disabled = trilha.scrollLeft < 4; dir.disabled = trilha.scrollLeft + trilha.clientWidth > trilha.scrollWidth - 4; };
  trilha.addEventListener("scroll", setas); window.addEventListener("resize", setas);
  // o dia de hoje aparece logo de cara
  const h = trilha.querySelector(".cm-dia.hoje"); if (h) trilha.scrollLeft = Math.max(0, h.offsetLeft - trilha.offsetLeft - 9);
  setas();
}

/* ── resumo do dia: o cartão mostra os 3 últimos ── */
const rotDia = iso => DSEM[dt(iso).getDay()].toLowerCase() + ", " + ddmm(iso);
function corpoResumo(r) {
  const d = r.dados || {};
  const vagas = lista(d.vagas), avisos = lista(d.avisos), conq = lista(d.conquistas);
  return `${lista(d.duvidas).map(x => `<div class="cm-qa"><b>${esc(x.pergunta)}${x.tema ? `<span class="cm-tag">${esc(x.tema)}</span>` : ""}</b><span>${esc(x.resposta)}</span></div>`).join("")}
    <div class="cm-blocos">
      <div><h3>Vagas citadas</h3>${vagas.map(v => `<a href="vagas.html?q=${encodeURIComponent(String(v).split("·").pop().trim())}">${esc(v)}</a>`).join("") || "<p>Nenhuma</p>"}</div>
      <div><h3>Avisos</h3>${avisos.map(v => `<p>${esc(v)}</p>`).join("") || "<p>Nenhum</p>"}</div>
      <div><h3>Conquistas</h3>${conq.map(v => `<p>${esc(v)}</p>`).join("") || "<p>Nenhuma</p>"}</div>
    </div>`;
}
function resumoDoDia(ultimos) {
  let atual = ultimos.length - 1;
  const caixa = document.getElementById("resumo");
  const pintar = () => {
    const r = ultimos[atual], msgs = Number((r.dados || {}).mensagens) || 0;
    caixa.innerHTML = `<div class="cm-post-cab"><span class="av" style="background:#A85D24">EQ</span>
        <div><b>Equipe Hub · Resumo de ${esc(rotDia(r.dia))}${etiquetaPara(r.para)}</b><small>${msgs ? msgs + " mensagens nos grupos · " : ""}${Math.max(1, Math.round((lista(r.dados && r.dados.duvidas).length + 2) / 2))} min de leitura</small></div>
        ${ultimos.length > 1 ? `<div class="cm-dias">${ultimos.map((x, i) => `<button data-r="${i}" aria-pressed="${i === atual}">${DSEM[dt(x.dia).getDay()].slice(0, 3)} ${x.dia.slice(8)}</button>`).join("")}</div>` : ""}</div>
      ${corpoResumo(r)}
      <a class="cm-ir-forum" href="#forum">Os resumos dos outros dias ficam guardados no fórum, aqui embaixo ↓</a>`;
    caixa.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { atual = +b.dataset.r; pintar(); });
  };
  pintar();
}

/* ── fórum: resumos, avisos e materiais, com busca ── */
const F = { tipo: "todos", busca: "", mostrar: 8, aberto: null };
function marcar(txt, termo) {
  const t = String(txt || "");
  if (!termo) return esc(t);
  const i = norm(t).indexOf(termo);
  if (i < 0) return esc(t);
  return esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + termo.length)) + "</mark>" + esc(t.slice(i + termo.length));
}
function forum(posts) {
  const topicos = posts.filter(p => p.tipo !== "plano").map(p => {
    const d = p.dados || {};
    const texto = p.tipo === "resumo"
      ? lista(d.duvidas).map(x => x.pergunta + " " + x.resposta + " " + (x.tema || "")).join(" ") + " " + lista(d.vagas).join(" ") + " " + lista(d.avisos).join(" ")
      : (d.texto || "");
    return { p, tipo: p.tipo, dia: p.dia, titulo: p.tipo === "resumo" ? "Resumo do dia · " + rotDia(p.dia) : (p.titulo || ""), texto };
  }).sort((a, b) => b.dia.localeCompare(a.dia));
  const termo = norm(F.busca.trim());
  const achados = topicos.filter(t => (F.tipo === "todos" || t.tipo === F.tipo) && (!termo || norm(t.titulo + " " + t.texto).includes(termo)));
  const conta = tipo => topicos.filter(t => tipo === "todos" || t.tipo === tipo).length;
  document.getElementById("forumChips").innerHTML = [["todos", "Tudo"], ["resumo", "Resumos do dia"], ["aviso", "Avisos"], ["material", "Materiais"]]
    .map(([k, n]) => `<button data-tipo="${k}" aria-pressed="${F.tipo === k}">${n}<small>${conta(k)}</small></button>`).join("");
  document.querySelectorAll("[data-tipo]").forEach(b => b.onclick = () => { F.tipo = b.dataset.tipo; F.mostrar = 8; forum(posts); });
  document.getElementById("forumN").textContent = termo
    ? (achados.length ? `${achados.length} ${achados.length === 1 ? "resultado" : "resultados"} para “${F.busca.trim()}”` : "")
    : topicos.length ? `${achados.length} ${achados.length === 1 ? "publicação guardada" : "publicações guardadas"}, da mais nova para a mais antiga` : "";
  const vis = achados.slice(0, F.mostrar);
  const nomeTipo = { resumo: "Resumo", aviso: "Aviso", material: "Material" };
  document.getElementById("forumLista").innerHTML = !topicos.length
    ? `<div class="cm-vazio">Ainda não há nada guardado no fórum.</div>`
    : !achados.length ? `<div class="cm-vazio">Nada encontrado${termo ? ` para “${esc(F.busca.trim())}”` : ""}. Tente outra palavra, como W-8BEN, teste ou pagamento.</div>`
    : vis.map(t => {
        const d = t.dia.split("-"), id = t.p.id, res = t.tipo === "resumo";
        const qa = res ? lista((t.p.dados || {}).duvidas) : [];
        const trechos = termo && res ? qa.filter(x => norm(x.pergunta + " " + x.resposta + " " + (x.tema || "")).includes(termo)).slice(0, 2) : [];
        const link = !res && /^https:\/\//i.test((t.p.dados || {}).link || "") ? ` <a href="${esc(t.p.dados.link)}" target="_blank" rel="noopener noreferrer">Abrir ↗</a>` : "";
        const corpo = trechos.length ? `<span class="ac">${trechos.map(x => `<p><b>${marcar(x.pergunta, termo)}</b> ${marcar(x.resposta, termo)}</p>`).join("")}</span>`
          : res ? `<span class="ac">${qa.map(x => esc(x.pergunta)).join(" · ")}</span>` : `<span class="ac">${marcar(t.texto, termo)}${link}</span>`;
        const cab = `<span class="dt"><b>${+d[2]}</b><span>${MESES[+d[1] - 1]}</span></span>
          <span class="mid"><span class="tt"><span class="tp tp-${t.tipo}">${nomeTipo[t.tipo]}</span>${marcar(t.titulo, termo)}${etiquetaPara(t.p.para)}</span>${corpo}</span>`;
        return `<div class="cm-top${F.aberto === id ? " aberto" : ""}">${res
          ? `<button data-top="${esc(id)}">${cab}<span class="seta" aria-hidden="true">›</span></button>${F.aberto === id ? `<div class="det">${corpoResumo(t.p)}</div>` : ""}`
          : `<div class="lin">${cab}</div>`}</div>`;
      }).join("") + (achados.length > vis.length ? `<button class="cm-mais" id="forumMais">Mostrar mais ${Math.min(8, achados.length - vis.length)}</button>` : "");
  document.querySelectorAll("[data-top]").forEach(b => b.onclick = () => { F.aberto = F.aberto === b.dataset.top ? null : b.dataset.top; forum(posts); });
  const mais = document.getElementById("forumMais"); if (mais) mais.onclick = () => { F.mostrar += 8; forum(posts); };
  const busca = document.getElementById("busca");
  if (!busca.dataset.ligado) { busca.dataset.ligado = "1"; busca.addEventListener("input", () => { F.busca = busca.value; F.mostrar = 8; F.aberto = null; forum(posts); }); }
}

/* ── perguntas frequentes: o tema que aparece em 2 resumos ou mais ── */
function perguntasFrequentes(resumos) {
  const temas = {};
  resumos.forEach(r => {
    const vistos = new Set();
    lista((r.dados || {}).duvidas).forEach(x => {
      const k = norm(x.tema || "").trim(); if (!k || vistos.has(k)) return; vistos.add(k);
      const t = temas[k] = temas[k] || { tema: x.tema, n: 0, ultima: null };
      t.n++; t.ultima = x;   // os resumos vêm do mais antigo para o mais novo: fica a resposta mais recente
    });
  });
  const top = Object.values(temas).filter(t => t.n >= 2).sort((a, b) => b.n - a.n).slice(0, 6);
  const alvoFaq = document.getElementById("faqLista");
  alvoFaq.innerHTML = top.length ? top.map(t => `<details><summary>${esc(t.ultima.pergunta)}<span>${t.n} resumos</span></summary><p>${esc(t.ultima.resposta)}</p>
      <button class="cm-faq-ver" data-faq="${esc(t.tema)}">Ver tudo o que já foi falado sobre isso no fórum →</button></details>`).join("")
    : `<p class="cm-vazio">As perguntas que se repetirem nos resumos aparecem aqui.</p>`;
  alvoFaq.querySelectorAll("[data-faq]").forEach(b => b.onclick = () => {
    const busca = document.getElementById("busca");
    busca.value = b.dataset.faq; F.busca = b.dataset.faq; F.tipo = "todos"; F.mostrar = 8; F.aberto = null; forum(D.posts || []);
    document.getElementById("forum").scrollIntoView({ behavior: "smooth", block: "start" });
  });
}

/* ── encontros: clicou, abre; dali vai para a Agenda do Meu Controle ── */
async function naAgenda() {
  try { await Dados.abrir(); return (await Dados.listar("agenda")).filter(x => x.comunidadeId).map(x => x.comunidadeId); } catch (e) { return []; }
}
async function encontros() {
  const lista = D.encontros || [], caixa = document.getElementById("listaEnc");
  if (!lista.length) { caixa.innerHTML = `<p class="cm-vazio">Nenhum encontro marcado por enquanto.</p>`; return; }
  const ja = await naAgenda();
  caixa.innerHTML = lista.map(e => `<button class="cm-enc" data-enc="${esc(e.id)}">
    <div class="dt"><b>${+e.data.slice(8)}</b><span>${MESES[+e.data.slice(5, 7) - 1]}</span></div>
    <div class="tx">${esc(e.titulo)}${etiquetaPara(e.para)}<small>${DSEM[dt(e.data).getDay()].toLowerCase()}${e.inicio ? ", " + hora(e.inicio) : ""}</small></div>
    ${ja.indexOf(e.id) >= 0 ? `<span class="ok">Na agenda</span>` : `<span class="mais" aria-hidden="true">+</span>`}</button>`).join("");
  caixa.querySelectorAll("[data-enc]").forEach(b => b.onclick = () => abrirEncontro(lista.find(e => e.id === b.dataset.enc), ja.indexOf(b.dataset.enc) >= 0));
}
function abrirEncontro(e, ja) {
  const veu = document.createElement("div");
  veu.className = "cm-veu";
  const quando = `${DSEM[dt(e.data).getDay()]}, ${+e.data.slice(8)} de ${MESES_LONGO[+e.data.slice(5, 7) - 1]}${e.inicio ? `, ${e.fim ? "das " + hora(e.inicio) + " às " + hora(e.fim) : "às " + hora(e.inicio)}` : ""}`;
  veu.innerHTML = `<div class="cm-jan" role="dialog" aria-modal="true" aria-label="${esc(e.titulo)}">
    <div class="cm-jan-topo"><div class="dt"><b>${+e.data.slice(8)}</b><span>${MESES[+e.data.slice(5, 7) - 1]}</span></div><h3>${esc(e.titulo)}</h3></div>
    <div class="cm-jan-corpo">
      <div class="cm-jan-linha"><span>Quando</span>${esc(quando)}</div>
      ${e.onde ? `<div class="cm-jan-linha"><span>Onde</span>${/^https:\/\//i.test(e.onde) ? `<a href="${esc(e.onde)}" target="_blank" rel="noopener noreferrer">${esc(e.onde)}</a>` : esc(e.onde)}</div>` : ""}
      ${e.texto ? `<p class="cm-jan-txt">${esc(e.texto)}</p>` : ""}
      <div data-ok>${ja ? `<div class="cm-jan-ok">Este encontro já está na sua agenda do Meu Controle.</div>` : ""}</div>
      <div class="cm-jan-acoes"><button class="cm-bt" data-fechar>Fechar</button>
        ${ja ? `<a class="cm-bt forte" href="controle.html#agenda">Ver na minha agenda</a>` : `<button class="cm-bt forte" data-agendar>Adicionar à minha agenda</button>`}</div>
    </div></div>`;
  document.body.appendChild(veu);
  const fechar = () => { veu.remove(); document.removeEventListener("keydown", tecla); };
  const tecla = ev => { if (ev.key === "Escape") fechar(); };
  veu.addEventListener("click", ev => { if (ev.target === veu || ev.target.closest("[data-fechar]")) fechar(); });
  document.addEventListener("keydown", tecla);
  const bt = veu.querySelector("[data-agendar]");
  if (bt) bt.onclick = async () => {
    bt.disabled = true;
    try {
      await Dados.abrir();
      const ja2 = (await Dados.listar("agenda")).some(x => x.comunidadeId === e.id);
      if (!ja2) await Dados.salvar("agenda", { tipo: e.tipo || "estudo", titulo: e.titulo, data: e.data, inicio: e.inicio || "", fim: e.fim || "",
        aplicacaoId: "", comunidadeId: e.id, nota: "Encontro da Comunidade." + (e.onde ? " " + e.onde : "") });
      veu.querySelector("[data-ok]").innerHTML = `<div class="cm-jan-ok">Pronto: o encontro entrou na sua agenda do Meu Controle.</div>`;
      bt.outerHTML = `<a class="cm-bt forte" href="controle.html#agenda">Ver na minha agenda</a>`;
      encontros();
    } catch (er) { console.warn(er); bt.disabled = false; avisar("Não deu para pôr na agenda agora. Tente de novo."); }
  };
  (veu.querySelector(".cm-bt.forte") || veu.querySelector("[data-fechar]")).focus();
}

/* ── abertura: só com conta, e o banco decide o que cada um vê ── */
(async function () {
  const espera = document.getElementById("espera");
  if (typeof supabase === "undefined" || !supabase.createClient) {
    espera.textContent = "Não deu para falar com o servidor de contas. Confira a internet e recarregue a página.";
    return;
  }
  const cli = supabase.createClient(ENDERECO, CHAVE_PUBLICA, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } });
  let sessao = null;
  try { sessao = (await cli.auth.getSession()).data.session; } catch (e) { console.warn(e); }
  if (!sessao) { espera.outerHTML = Acesso.htmlAviso("A Comunidade é para quem tem conta", "Entre na sua conta para ver o plano da semana, os resumos e os encontros."); return; }
  const r = await cli.rpc("comunidade_ler");
  if (r.error) {
    console.warn(r.error);
    alvo.innerHTML = r.error.hint === "sem_plano"
      ? `<div class="cm-fechada"><h1>A Comunidade é dos planos Black e Pro</h1><p>Se você já é aluno de um desses planos e ainda não tem acesso, fale com a equipe para ela ligar o seu plano no site.</p></div>`
      : `<div class="cm-espera">Não deu para abrir a Comunidade agora. Confira a internet e recarregue a página.</div>`;
    return;
  }
