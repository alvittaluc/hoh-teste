<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Início · Home Office Hub</title>

<style>
/* Início da plataforma: só o que ajuda a pessoa hoje. Três perguntas, nesta ordem:
   o que eu preciso fazer, que vaga vale olhar agora, e como está o meu mês. */
.in-main { max-width:1440px; margin:0; padding:30px 32px 80px; }
.in-ola { font-family:var(--display); font-weight:400; color:var(--ink); font-size:clamp(32px,4vw,46px); letter-spacing:-.02em; line-height:1.08; }
.in-sub { margin-top:8px; font-size:15.5px; color:var(--ink-2); }
.in-grade { display:grid; grid-template-columns:minmax(0,1.9fr) minmax(300px,1fr); gap:22px; margin-top:28px; align-items:start; }
.in-cx { background:var(--panel); border:1px solid var(--line-soft); border-radius:var(--raio); box-shadow:var(--sombra); padding:22px 22px 14px; }
.in-cx + .in-cx { margin-top:22px; }
.in-cab { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:12px; }
.in-cab h2 { font-size:17px; font-weight:600; color:var(--ink); letter-spacing:-.01em; display:flex; align-items:center; gap:9px; }
.in-cab a { font-size:13.5px; font-weight:500; color:var(--signal); white-space:nowrap; }
.in-cab a:hover { text-decoration:underline; text-underline-offset:3px; }
.in-nota { font-size:13.5px; color:var(--ink-3); margin:-6px 0 10px; }

/* o que fazer */
.fz { display:grid; grid-template-columns:40px minmax(0,1fr) auto; gap:14px; align-items:center; padding:13px 0; border-top:1px solid var(--line-soft); }
.fz:first-of-type { border-top:0; }
.fz-ic { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--signal-suave); color:var(--signal); }
.fz-ic.am { background:var(--amber-suave); color:var(--amber); }
.fz-ic.vi { background:#F1EEF7; color:#5B4B9E; }
.fz-ic svg { width:19px; height:19px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.fz b { display:block; font-size:14.5px; font-weight:550; color:var(--ink); line-height:1.35; }
.fz small { display:block; font-size:13px; color:var(--ink-3); margin-top:1px; }
.fz small.urgente { color:var(--amber); font-weight:500; }
.fz-bt { font-size:13.5px; font-weight:500; padding:8px 14px; border-radius:999px; border:1px solid var(--line); background:var(--panel); color:var(--ink); white-space:nowrap; transition:box-shadow .15s, border-color .15s; }
.fz-bt:hover { border-color:#C9C0B0; box-shadow:var(--sombra); }
.fz-vazio { padding:10px 0 14px; font-size:14.5px; color:var(--ink-2); }

/* vagas: a mesma linha das vagas do site, com o azul e o selo verde do Em alta */
.lv { display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:14px; align-items:center; padding:12px 14px; margin:0 -8px 8px; border-radius:14px; border:1px solid var(--line-soft); background:var(--panel); transition:border-color .15s, box-shadow .15s; }
.lv:hover { border-color:#D6CDBD; box-shadow:var(--sombra); }
.lv.chamando { border-color:#CCDCEE; background:radial-gradient(90% 160% at 0% 50%, #E2ECF8 0%, rgba(234,241,248,.55) 38%, rgba(255,255,255,0) 70%), var(--panel); }
.lv.chamando:hover { border-color:#AFC7E4; }
.lv-marca { width:44px; height:44px; border-radius:12px; border:1px solid var(--line-soft); display:grid; place-items:center; overflow:hidden; font-weight:600; font-size:13px; }
.lv b { display:block; font-size:14.5px; font-weight:550; color:var(--ink); line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lv small { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:13px; color:var(--ink-3); margin-top:2px; }
.lv .dir { text-align:right; font-size:13px; color:var(--ink-2); white-space:nowrap; }
.lv .dir em { display:block; font-style:normal; font-size:12px; color:var(--ink-3); }
.selo-chamando { display:inline-flex; align-items:center; gap:7px; font-size:11.5px; font-weight:600; white-space:nowrap;
  color:#156B45; background:#E3F5EC; border:1px solid #BFE6D2; border-radius:20px; padding:1px 10px 1px 8px; }
.ch-pulso { position:relative; display:inline-block; width:7px; height:7px; border-radius:50%; background:#2BB673; flex-shrink:0; }
.ch-pulso::after { content:""; position:absolute; inset:0; border-radius:50%; background:#2BB673; animation:ch-pulsa 1.8s ease-out infinite; }
@keyframes ch-pulsa { 0% { transform:scale(1); opacity:.7; } 80%, 100% { transform:scale(3.2); opacity:0; } }
@media (prefers-reduced-motion:reduce){ .ch-pulso::after { animation:none; opacity:0; } }
.selo-nova { font-size:11px; font-weight:600; color:var(--amber); background:var(--amber-suave); padding:1px 8px; border-radius:999px; }

/* coluna da direita */
.in-cx.verde { background:linear-gradient(170deg,#F4FAF6 0%,#E9F5EE 100%); border-color:#D3EBDD; }
.in-cx.verde .in-cab a { color:#1F7A4D; }
.in-cx.verde .nm a { border-top-color:#D3EBDD; }
.in-cx.verde .nm a b { color:#16603C; }
.nm { display:grid; gap:2px; }
.nm a { display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:11px 0; border-top:1px solid var(--line-soft); font-size:14px; color:var(--ink-2); }
.nm a:first-child { border-top:0; padding-top:2px; }
.nm a b { font-family:var(--display); font-weight:400; font-size:24px; color:var(--ink); letter-spacing:-.01em; }
.nm a:hover span { color:var(--signal); }
.at { display:grid; gap:8px; }
.at a { display:flex; align-items:center; gap:11px; padding:11px 13px; border-radius:12px; border:1px solid var(--line-soft); background:var(--panel-2); font-size:14px; font-weight:500; color:var(--ink); transition:border-color .15s, background .15s; }
.at a:hover { border-color:#CFE0F1; background:var(--signal-suave); }
.at svg { width:18px; height:18px; fill:none; stroke:var(--signal); stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
.in-teste { margin-top:26px; font-size:12.5px; color:var(--ink-3); text-align:center; }
.in-teste button { font:inherit; color:var(--signal); background:none; border:0; text-decoration:underline; text-underline-offset:3px; cursor:pointer; }

@media (max-width:1100px) { .in-grade { grid-template-columns:1fr; } }
@media (max-width:640px) {
  .in-main { padding:22px 16px 90px; }
  .fz { grid-template-columns:36px minmax(0,1fr); }
  .fz-ic { width:36px; height:36px; }
  .fz-bt { grid-column:2; justify-self:start; }
  .lv { grid-template-columns:40px minmax(0,1fr); }
  .lv .dir { display:none; }
  .lv b { white-space:normal; }
}
</style>
</head>
<body>
<main class="in-main">
  <h1 class="in-ola" id="ola">Olá.</h1>
  <p class="in-sub" id="olaSub">Abrindo o seu dia…</p>

  <div class="in-grade">
    <div>
      <section class="in-cx">
        <div class="in-cab"><h2>Para fazer</h2><a href="controle.html#hoje">Abrir o Hoje</a></div>
        <div id="fazer"></div>
      </section>

      <section class="in-cx">
        <div class="in-cab"><h2><span class="ch-pulso" aria-hidden="true"></span>Em alta</h2><a href="vagas.html">Ver todas as vagas</a></div>
        <p class="in-nota">Vagas que estão chamando gente agora, confirmadas pela equipe.</p>
        <div id="emAlta"></div>
      </section>

      <section class="in-cx">
        <div class="in-cab"><h2>Novas nesta semana</h2><a href="vagas.html">Ver todas as vagas</a></div>
        <div id="novas"></div>
      </section>
    </div>

    <div>
      <section class="in-cx">
        <div class="in-cab"><h2>Atalhos</h2></div>
        <div class="at">
          <a href="controle.html#aplicacoes"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Marcar uma candidatura</a>
          <a href="controle.html#hoje"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>Lançar as horas de hoje</a>
          <a href="ferramenta-curriculo.html"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Avaliar o meu currículo</a>
        </div>
      </section>
      <section class="in-cx verde">
        <div class="in-cab"><h2>Ganhos e horas</h2><a href="controle.html#painel">Ver os ganhos</a></div>
        <div class="nm" id="mes"></div>
      </section>
    </div>
  </div>
  <p class="in-teste" id="inTeste"></p>
</main>

<script src="supabase-porta-falso.js"></script>
<script src="layout.js"></script>
<script src="controle-dados.js?v=6"></script>
<script>
montarLayout("inicio");
(async function () {
  const $ = s => document.querySelector(s);
  const SVG = {
    teste: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 14l2 2 4-4"/>',
    entrevista: '<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
    agenda: '<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>',
    horas: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/>',
    perfil: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  };
  const svg = n => `<svg viewBox="0 0 24 24">${SVG[n]}</svg>`;

  // cumprimento
  let meta = {};
  try { meta = JSON.parse(localStorage.getItem("sb-zrqucjktympnwilbvisw-auth-token")).user.user_metadata || {}; } catch (e) {}
  const nome = String(meta.nome || "").trim().split(/\s+/)[0];
  const h = new Date().getHours();
  $("#ola").textContent = (h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite") + (nome ? ", " + nome + "." : ".");

  // dados do Meu Controle, deste navegador
  await Dados.abrir();
  const [aps, trabs, regs, agenda] = await Promise.all([Dados.listar("aplicacoes"), Dados.listar("trabalhos"), Dados.listar("registros"), Dados.listar("agenda")]);
  const hoje = Dados.hoje();
  const somar = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
  const quando = iso => { const n = Math.round((new Date(iso + "T12:00:00") - new Date(hoje + "T12:00:00")) / 864e5);
    const dd = iso.slice(8, 10) + "/" + iso.slice(5, 7);
    return n < 0 ? "Atrasado, era " + dd : n === 0 ? "Hoje" : n === 1 ? "Amanhã" : ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"][new Date(iso + "T12:00:00").getDay()] + ", " + dd; };

  /* PARA FAZER: só o que tem data até daqui a 7 dias, o mais perto primeiro */
  const itens = [];
  const ativos = ["aplicado", "teste", "prova", "entrevista", "banco"];
  aps.filter(a => a.proximo && a.proximoEm && a.proximoEm <= somar(hoje, 7) && ativos.includes(a.estado)).forEach(a => {
    const tipo = a.estado === "entrevista" ? "entrevista" : "teste";
    const ag = agenda.find(i => i.aplicacaoId === a.id && i.data === a.proximoEm && i.inicio);
    itens.push({ data: a.proximoEm, ic: tipo, cor: a.proximoEm <= somar(hoje, 1) ? "am" : "", titulo: a.proximo + " · " + a.empresa, quando: quando(a.proximoEm) + (ag ? " às " + ag.inicio.replace(":00", "h") : ""), bt: "Ver a candidatura", href: "controle.html#aplicacoes" });
  });
  const nomeTrab = id => { const t = trabs.find(x => x.id === id); return t ? (t.projeto || t.empresa) : "trabalho"; };
  agenda.filter(i => i.data >= hoje && i.data <= somar(hoje, 2)).forEach(i => {
    if (i.tipo === "trabalho") itens.push({ data: i.data, ic: "horas", cor: "", titulo: (i.horas === 1 ? "1 hora" : i.horas + " horas") + " de " + nomeTrab(i.trabalhoId) + (i.inicio ? " às " + i.inicio.replace(":00", "h") : ""), quando: quando(i.data), bt: i.data === hoje ? "Lançar as horas" : "Ver na agenda", href: i.data === hoje ? "controle.html#hoje" : "controle.html#agenda" });
    else if (!i.aplicacaoId) itens.push({ data: i.data, ic: i.tipo === "estudo" ? "agenda" : "entrevista", cor: i.tipo === "estudo" ? "vi" : "", titulo: i.titulo, quando: quando(i.data) + (i.inicio ? " às " + i.inicio.replace(":00", "h") : ""), bt: "Ver na agenda", href: "controle.html#agenda" });
  });
  itens.sort((a, b) => a.data.localeCompare(b.data));
  $("#fazer").innerHTML = itens.length ? itens.slice(0, 5).map(i => `<div class="fz"><span class="fz-ic ${i.cor}">${svg(i.ic)}</span>
      <div><b>${esc(i.titulo)}</b><small class="${i.cor === "am" ? "urgente" : ""}">${esc(i.quando)}</small></div>
      <a class="fz-bt" href="${i.href}">${i.bt}</a></div>`).join("")
    : aps.length || trabs.length
      ? `<p class="fz-vazio">Nada marcado para os próximos dias. Quando você guardar um teste, uma entrevista ou horas de trabalho no Meu Controle, eles aparecem aqui.</p>`
      : /* conta nova: os primeiros passos no lugar da lista */
        [["vagas", "Veja as vagas abertas a todos", "Não pedem diploma: anotação, avaliação de IA, tradução e QA.", "Ver as vagas", "vagas.html?ver=todas"],
         ["agenda", "Comece pelo curso de Fundamentos", "Uma hora para entender como o trabalho funciona antes do primeiro teste.", "Começar", "curso-fundamentos.html"],
         ["teste", "Guarde a sua primeira candidatura", "No Meu Controle, para saber em que etapa está cada uma.", "Abrir", "controle.html#aplicacoes"]]
        .map(([i, t, d, b, h]) => `<div class="fz"><span class="fz-ic">${svg(i === "vagas" ? "perfil" : i)}</span><div><b>${t}</b><small>${d}</small></div><a class="fz-bt" href="${h}">${b}</a></div>`).join("");
  if (!itens.length && !aps.length && !trabs.length) document.querySelector("#fazer").previousElementSibling.querySelector("h2").textContent = "Para começar";

  const ativas = aps.filter(a => ["aplicado", "teste", "prova", "entrevista"].includes(a.estado)).length;
  $("#olaSub").textContent = itens.length
    ? (itens.length === 1 ? "Uma coisa" : itens.length + " coisas") + " para os próximos dias" + (ativas ? " e " + ativas + (ativas === 1 ? " candidatura andando." : " candidaturas andando.") : ".")
    : "Veja as vagas que estão chamando gente agora.";

  /* SEU MÊS */
  const mes = hoje.slice(0, 7);
  const seg = (() => { const d = new Date(hoje + "T12:00:00"); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d.toISOString().slice(0, 10); })();
  const horasSemana = regs.filter(r => r.data >= seg && r.data <= hoje).reduce((s, r) => s + (+r.horas || 0), 0);
  let ganho = 0, moeda = "US$";
  regs.filter(r => r.data.slice(0, 7) === mes).forEach(r => { const t = trabs.find(x => x.id === r.trabalhoId); if (t && t.pagamento === "hora") { ganho += (+r.horas || 0) * (+t.valor || 0); if (t.moeda === "BRL") moeda = "R$"; } });
  const n = v => (Math.round(v * 10) / 10).toLocaleString("pt-BR");
  $("#mes").innerHTML = `
    <a href="controle.html#trabalhos"><span>Horas nesta semana</span><b>${n(horasSemana)} h</b></a>
    <a href="controle.html#painel"><span>Ganhos em ${new Date().toLocaleDateString("pt-BR", { month: "long" })}</span><b>${moeda} ${ganho.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</b></a>`;

  /* VAGAS */
  const [dv, de, pulso] = await Promise.all([lerVagas(), lerEmpresas(), fetch("pulso.json?v=" + Date.now()).then(r => r.json()).catch(() => ({}))]);
  const empresas = de.empresas || [];
  const emp = id => empresas.find(e => e.id === id) || { nome: id, sigla: String(id || "?").slice(0, 2).toUpperCase() };
  const vagas = dv.vagas || [];
  const altas = (pulso.destaques || []).map(d => vagas.find(v => v.id === d.id)).filter(Boolean);
  const ultima = vagas.reduce((m, v) => (v.data_vista || "") > m ? v.data_vista : m, "");
  const dias = s => Math.round((new Date(ultima) - new Date(s)) / 864e5);
  const textoData = v => { const s = v.data_reaberta || v.data_ref || v.data_vista; const d = dias(s); const t = d <= 0 ? "hoje" : d === 1 ? "ontem" : "há " + d + " dias"; return (v.data_reaberta ? "reaberta " : "") + t; };
  const linha = (v, alta) => { const e = emp(v.empresa), r = v.resumo || {};
    return `<a class="lv${alta ? " chamando" : ""}" href="vaga.html?id=${encodeURIComponent(v.id)}">
      <span class="lv-marca" style="background:${esc(e.bg ? "#fff" : "#F1ECE3")}">${logoHtml(e, 44)}</span>
      <div style="min-width:0"><b>${esc(v.titulo.replace(/^\*/, ""))}</b>
        <small>${esc(e.nome)}${alta ? '<span class="selo-chamando"><span class="ch-pulso" aria-hidden="true"></span>Contratando com frequência</span>' : ""}</small></div>
      <div class="dir">${esc(r.remuneracao || "")}<em>${textoData(v)}</em></div></a>`; };
  $("#emAlta").innerHTML = altas.slice(0, 3).map(v => linha(v, true)).join("") || '<p class="fz-vazio">A equipe ainda não marcou vagas em alta.</p>';
  const ids = new Set(altas.map(v => v.id));
  const novas = vagas.filter(v => !ids.has(v.id) && dias(v.data_vista) <= 7).sort((a, b) => (b.data_vista || "").localeCompare(a.data_vista || ""));
  $("#novas").innerHTML = novas.slice(0, 4).map(v => linha(v, false)).join("") || '<p class="fz-vazio">Nenhuma vaga nova nesta semana ainda.</p>';
  if (novas.length > 4) $("#novas").insertAdjacentHTML("beforeend", `<p class="in-nota" style="margin:4px 0 6px">e mais ${novas.length - 4} na aba Vagas.</p>`);
})();
</script>
</body>
