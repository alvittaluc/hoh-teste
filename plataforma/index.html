<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Home Office Hub · Plataforma</title>
<link rel="icon" href="../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Hedvig+Letters+Serif:opsz@12..24&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F4EF; --bg-soft:#F1ECE3; --panel:#fff; --panel-2:#FBF9F5;
  --line:#DED7CA; --line-soft:#EAE4D9;
  --ink:#10203A; --ink-2:#54606F; --ink-3:#66717F;
  --signal:#1A4893; --signal-dim:#4E9AC8; --signal-suave:#EAF1F8; --ceu:#8FC1E3;
  --amber:#A85D24; --amber-suave:#FBF0E4; --verde:#1F7A4D; --verde-suave:#E6F3EC; --verm:#A93B35; --verm-suave:#F8E9E7;
  --lado:#0F1D33; --lado-2:#16283F; --lado-linha:#24354E; --lado-txt:#C9D4E2; --lado-txt-2:#8496AD;
  --display:'Hedvig Letters Serif',Georgia,serif;
  --body:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --raio:18px;
  --sombra:0 1px 2px rgba(16,32,58,.04),0 8px 24px -12px rgba(16,32,58,.10);
  --sombra-alta:0 2px 4px rgba(16,32,58,.05),0 24px 48px -20px rgba(16,32,58,.25);
}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--bg);color:var(--ink-2);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:8px}
svg.ic{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ───────── estrutura ───────── */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.lado{position:sticky;top:0;height:100vh;background:var(--lado);color:var(--lado-txt);display:flex;flex-direction:column;overflow:hidden;z-index:60}
.lado::before{content:"";position:absolute;inset:0 0 auto 0;height:260px;pointer-events:none;
  background:radial-gradient(120% 90% at 0% -10%,rgba(52,113,173,.55),transparent 65%),radial-gradient(90% 80% at 100% -20%,rgba(102,166,209,.35),transparent 60%)}
.lado-topo{position:relative;display:flex;align-items:center;gap:11px;padding:20px 22px 10px}
.lado-topo img{width:32px;height:32px;border-radius:9px}
.lado-topo b{font-weight:600;color:#fff;font-size:15.5px;letter-spacing:-.015em;line-height:1.15}
.lado-topo small{display:block;font-size:11.5px;color:var(--lado-txt-2);font-weight:400;letter-spacing:.01em}
.lado nav{position:relative;flex:1;overflow-y:auto;padding:4px 12px 16px;scrollbar-width:thin;scrollbar-color:var(--lado-linha) transparent}
.grupo{margin-top:10px}
.grupo>span{display:block;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--lado-txt-2);padding:0 12px 6px}
.item{display:flex;align-items:center;gap:11px;padding:7px 12px;border-radius:11px;font-size:14px;color:var(--lado-txt);transition:background .15s,color .15s;position:relative}
.item:hover{background:rgba(255,255,255,.05);color:#fff}
.item.ativo{background:linear-gradient(90deg,rgba(143,193,227,.18),rgba(143,193,227,.06));color:#fff}
.item.ativo::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--ceu)}
.item.ativo svg{color:var(--ceu)}
.item .cont{margin-left:auto;font-size:11.5px;font-weight:600;min-width:22px;height:20px;padding:0 7px;border-radius:999px;display:grid;place-items:center;background:rgba(255,255,255,.09);color:var(--lado-txt)}
.item .cont.quente{background:#E7F0F9;color:var(--signal)}
.item .ponto{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#3DD68C;box-shadow:0 0 0 0 rgba(61,214,140,.6);animation:pulsa 2s infinite}
@keyframes pulsa{0%{box-shadow:0 0 0 0 rgba(61,214,140,.55)}70%{box-shadow:0 0 0 7px rgba(61,214,140,0)}100%{box-shadow:0 0 0 0 rgba(61,214,140,0)}}
.lado-pe{position:relative;border-top:1px solid var(--lado-linha);padding:12px}
.eu{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:12px}
.eu:hover{background:rgba(255,255,255,.05)}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:13px;color:#fff;background:linear-gradient(135deg,#2C6BB5,#1A4893);box-shadow:0 0 0 2px var(--lado),0 0 0 3.5px #4E9AC8;flex-shrink:0}
.eu b{display:block;color:#fff;font-weight:500;font-size:13.5px}
.eu small{font-size:11.5px;color:var(--ceu);display:flex;align-items:center;gap:4px}
.eu .sair{margin-left:auto;color:var(--lado-txt-2);padding:6px;border-radius:8px}
.eu .sair:hover{color:#fff;background:rgba(255,255,255,.08)}

.principal{min-width:0;display:flex;flex-direction:column}
.topo{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:12px;padding:14px 32px;background:rgba(247,244,239,.86);backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid transparent;transition:border-color .2s}
.topo.rolou{border-color:var(--line-soft)}
.abrir-lado{display:none;width:40px;height:40px;border-radius:12px;place-items:center;border:1px solid var(--line);background:var(--panel)}
.trilha{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px;white-space:nowrap}
.trilha i{width:18px;height:2px;background:var(--signal);display:inline-block;border-radius:2px}
.busca{margin-left:auto;display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);width:min(320px,34vw);color:var(--ink-3)}
.busca input{border:0;outline:0;background:none;width:100%;font-size:14px;color:var(--ink)}
.bt{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;border:1px solid var(--line);background:var(--panel);color:var(--ink);white-space:nowrap;transition:transform .12s,box-shadow .15s,background .15s}
.bt:hover{box-shadow:var(--sombra)}
.bt:active{transform:translateY(1px)}
.bt.forte{background:var(--signal);border-color:var(--signal);color:#fff}
.bt.forte:hover{background:#163e80}
.bt.peq{height:34px;padding:0 13px;font-size:13px}
.bt-ic{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);position:relative;color:var(--ink)}
.bt-ic .bolinha{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--amber);border:2px solid var(--panel)}
.tela{padding:10px 32px 56px;max-width:1360px;width:100%}
.tela.entra{animation:entra .28s ease}
@keyframes entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ───────── títulos ───────── */
h1.ola{font-family:var(--display);font-weight:400;color:var(--ink);font-size:clamp(34px,4.4vw,52px);letter-spacing:-.02em;line-height:1.05;margin:14px 0 8px}
h1.tit{font-family:var(--display);font-weight:400;color:var(--ink);font-size:clamp(30px,3.4vw,40px);letter-spacing:-.02em;line-height:1.1;margin:14px 0 6px}
.sub{font-size:15px;color:var(--ink-2);max-width:720px}
.sub b{color:var(--ink);font-weight:600}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}

/* ───────── cartões ───────── */
.grade{display:grid;gap:18px}
.g-3{grid-template-columns:1.05fr 1.05fr .9fr}
.g-2{grid-template-columns:1fr 1fr}
.g-21{grid-template-columns:1.6fr 1fr}
.cartao{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--raio);box-shadow:var(--sombra);padding:22px;min-width:0}
.cartao h2{font-size:15.5px;font-weight:600;color:var(--ink);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.c-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.link{font-size:13px;font-weight:500;color:var(--signal);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.link svg{width:15px;height:15px}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.chips{display:inline-flex;gap:3px;padding:3px;border-radius:999px;background:var(--bg-soft)}
.chips button{font-size:12px;font-weight:500;padding:5px 11px;border-radius:999px;color:var(--ink-2)}
.chips button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(16,32,58,.12)}
.escuro{display:flex;flex-direction:column;background:linear-gradient(160deg,#173462 0%,#10203A 70%);border-color:#1F3A66;color:var(--lado-txt)}
.escuro h2{color:#fff}
.escuro .chips{background:rgba(255,255,255,.08)}
.escuro .chips button{color:var(--lado-txt)}
.escuro .chips button.on{background:#fff;color:var(--ink)}
.escuro .link{color:var(--ceu)}
.claro{background:linear-gradient(170deg,#FFFFFF 0%,#EEF4FA 100%)}
.num{font-family:var(--display);font-size:44px;line-height:1;color:var(--ink);letter-spacing:-.02em}
.escuro .num{color:#fff}
.rot{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:7px}
.escuro .rot{color:var(--lado-txt-2)}
.var{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--verde-suave);color:var(--verde);margin-top:8px}
.escuro .var{background:rgba(61,214,140,.14);color:#7FE3B0}
.linha-num{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap}
.mini{font-size:26px}
.barras{display:flex;align-items:flex-end;gap:8px;height:92px;flex:1;min-height:92px;max-height:150px;margin-top:22px}
#ganhosCorpo{flex:1;display:flex;flex-direction:column}
.barras div{flex:1;border-radius:6px 6px 3px 3px;background:rgba(143,193,227,.35);position:relative;min-height:6px;transition:height .45s cubic-bezier(.2,.8,.2,1)}
.barras div.agora{background:#fff}
.barras div span{position:absolute;bottom:-20px;left:0;right:0;text-align:center;font-size:10.5px;color:var(--lado-txt-2);text-transform:uppercase;letter-spacing:.06em}
.escuro .rodape{margin-top:auto;padding-top:34px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--lado-txt-2);flex-wrap:wrap}
.escuro .rodape b{color:#fff;font-weight:600}

.funil{display:grid;gap:9px;margin-top:18px}
.funil .f{display:grid;grid-template-columns:118px 1fr 26px;align-items:center;gap:10px;font-size:13px;color:var(--ink-2)}
.funil .f .tr{height:10px;border-radius:999px;background:var(--bg-soft);overflow:hidden}
.funil .f .tr i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#2C6BB5,#4E9AC8);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.funil .f.ok .tr i{background:linear-gradient(90deg,#1F7A4D,#3DAA72)}
.funil .f b{text-align:right;color:var(--ink);font-weight:600}

.ult{display:grid;gap:2px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line-soft)}
.ult .u{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:center;padding:7px 4px;border-radius:10px;cursor:pointer}
.ult .u:hover{background:rgba(255,255,255,.7)}
.ult .logo{width:32px;height:32px;border-radius:9px}.ult .logo img{width:24px;height:24px}
.ult b{display:block;font-size:13px;color:var(--ink);font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ult small{display:block;font-size:12px;color:var(--signal)}.ult small.am{color:var(--amber)}
.hoje-lista{display:grid;gap:8px}
.hj{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--panel-2);border:1px solid var(--line-soft)}
.hj .qd{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;background:var(--signal-suave);color:var(--signal)}
.hj .qd.am{background:var(--amber-suave);color:var(--amber)}
.hj .qd.vd{background:var(--verde-suave);color:var(--verde)}
.hj b{display:block;font-size:13.5px;color:var(--ink);font-weight:550;line-height:1.3}
.hj small{font-size:12px;color:var(--ink-3)}

.cal{margin-top:16px}
.cal-cab{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-cab b{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--signal);padding:4px 12px;border-radius:999px}
.cal-cab button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--ink-3)}
.cal-cab button:hover{background:var(--bg-soft)}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12.5px;row-gap:2px}
.cal-g .sem{font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--ink-3);padding:4px 0}
.cal-g .d{position:relative;height:32px;display:grid;place-items:center;border-radius:9px;color:var(--ink)}
.cal-g .d.fora{color:#B9B2A6}
.cal-g .d.hoje{background:var(--signal);color:#fff;font-weight:600}
.cal-g .d.tem::after{content:"";position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:var(--amber)}
.cal-g .d.hoje.tem::after{background:#fff}

.vlista{display:grid}
.vl{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 6px;border-top:1px solid var(--line-soft);cursor:pointer;border-radius:10px;transition:background .15s}
.vl:first-child{border-top:0}
.vl:hover{background:var(--panel-2)}
.logo{width:40px;height:40px;border-radius:11px;border:1px solid var(--line-soft);background:#fff;display:grid;place-items:center;overflow:hidden;flex-shrink:0}
.logo img{width:30px;height:30px;object-fit:contain}
.vl b{display:block;font-size:14px;font-weight:550;color:var(--ink);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vl small{font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.vl .dir{text-align:right;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.vl .dir em{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3)}
.selo-alta{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--verde);background:var(--verde-suave);padding:3px 9px;border-radius:999px;white-space:nowrap}
.selo-alta::before{content:"";width:7px;height:7px;border-radius:50%;background:#22B36B;animation:pulsa 2s infinite}
.selo-nova{font-size:11px;font-weight:600;color:var(--amber);background:var(--amber-suave);padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:1px}

.meta{display:grid;gap:14px}
.mt b{font-size:13.5px;color:var(--ink);font-weight:550}
.mt .lin{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
.mt .tr{height:9px;border-radius:999px;background:var(--bg-soft);overflow:hidden;display:flex}
.mt .tr i{background:var(--signal);display:block}
.mt .tr i.ag{background:repeating-linear-gradient(135deg,#9DBBE0 0 5px,#C4D6EC 5px 10px)}
.legenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--ink-3);margin-top:4px}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda span::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--signal)}
.legenda .lg-a::before{background:var(--amber-suave);box-shadow:inset 0 0 0 1.5px var(--amber)}.legenda .lg-v::before{background:var(--verde-suave);box-shadow:inset 0 0 0 1.5px var(--verde)}.legenda .lg-e::before{background:#EFEBF8;box-shadow:inset 0 0 0 1.5px #5B4B9E}.legenda .lg-t::before{background:var(--signal-suave);box-shadow:inset 0 0 0 1.5px var(--signal)}
.legenda span.ag::before{background:repeating-linear-gradient(135deg,#9DBBE0 0 3px,#C4D6EC 3px 6px)}

.curso-c{display:flex;gap:14px;align-items:center;padding:12px;border-radius:14px;border:1px solid var(--line-soft);background:var(--panel-2)}
.capa{width:46px;height:58px;border-radius:5px 9px 9px 5px;background:linear-gradient(160deg,#1A4893,#0F1D33);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:18px;flex-shrink:0;box-shadow:inset 4px 0 0 rgba(255,255,255,.14),0 6px 14px -6px rgba(16,32,58,.5)}
.capa.voz{background:linear-gradient(160deg,#5B4B9E,#2A2152)}
.curso-c b{display:block;font-size:13.5px;color:var(--ink);font-weight:550;line-height:1.3}
.curso-c small{font-size:12px;color:var(--ink-3)}
.prog{height:6px;border-radius:999px;background:var(--line-soft);margin-top:7px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--signal);border-radius:999px}

.dolar{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.anel{--p:80;width:86px;height:86px;border-radius:50%;background:conic-gradient(var(--signal) calc(var(--p)*1%),var(--line-soft) 0);display:grid;place-items:center;flex-shrink:0}
.anel span{width:66px;height:66px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-weight:600;color:var(--ink);font-size:17px}

/* ───────── listas e quadros das outras telas ───────── */
.barra-f{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.barra-f .busca{margin-left:0;width:min(360px,100%)}
.filtros{display:flex;gap:6px;flex-wrap:wrap}
.filtros button{font-size:13px;font-weight:500;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2)}
.filtros button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabela{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--raio);box-shadow:var(--sombra);overflow:hidden}
.tl{display:grid;grid-template-columns:44px minmax(0,2.4fr) minmax(0,1.1fr) minmax(0,.9fr) 92px;gap:14px;align-items:center;padding:12px 18px;border-top:1px solid var(--line-soft);cursor:pointer;transition:background .15s}
.tl:hover{background:var(--panel-2)}
.tl.cab-t{cursor:default;background:var(--panel-2);border-top:0;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:10px 18px}
.tl.alta{background:linear-gradient(90deg,#EEF4FB,#fff 60%)}
.tl b{display:block;font-size:14px;color:var(--ink);font-weight:550;line-height:1.3}
.tl small{display:block;font-size:12.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl .c{font-size:13px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis}
.tag{display:inline-block;font-size:11.5px;font-weight:550;padding:3px 9px;border-radius:999px;background:var(--bg-soft);color:var(--ink-2);white-space:nowrap}
.tag.az{background:var(--signal-suave);color:var(--signal)}
.mais-linhas{padding:14px;text-align:center;border-top:1px solid var(--line-soft)}

.quadro{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--bg-soft);border-radius:16px;padding:12px;min-height:200px}
.col h3{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;padding:2px 4px 10px}
.col h3 span{background:var(--panel);border-radius:999px;padding:1px 8px;color:var(--ink);letter-spacing:0}
.kc{background:var(--panel);border:1px solid var(--line-soft);border-radius:13px;padding:12px;margin-bottom:10px;box-shadow:0 1px 2px rgba(16,32,58,.05);cursor:pointer;transition:transform .15s,box-shadow .15s}
.kc:hover{transform:translateY(-2px);box-shadow:var(--sombra)}
.kc .t{display:flex;gap:9px;align-items:center;margin-bottom:8px}
.kc .t .logo{width:30px;height:30px;border-radius:8px}

function calendario(mesDe){
  const ini = new Date(mesDe.getFullYear(), mesDe.getMonth(), 1);
  const inicioGrade = new Date(ini); inicioGrade.setDate(1 - ((ini.getDay() + 6) % 7));
  const marcados = new Set(AGENDA.map(a => iso(dia(a.d))));
  let h = ["SEG","TER","QUA","QUI","SEX","SÁB","DOM"].map(s => `<span class="sem">${s}</span>`).join("");
  const celulas = Math.ceil((((ini.getDay() + 6) % 7) + new Date(mesDe.getFullYear(), mesDe.getMonth() + 1, 0).getDate()) / 7) * 7;
  for (let i = 0; i < celulas; i++) {
    const d = new Date(inicioGrade); d.setDate(inicioGrade.getDate() + i);
    const cls = ["d", d.getMonth() !== mesDe.getMonth() ? "fora" : "", +d === +HOJE ? "hoje" : "", marcados.has(iso(d)) ? "tem" : ""].join(" ");
    h += `<span class="${cls}">${d.getDate()}</span>`;
  }
  return h;
}

function pintaGanhos(){
  const el = $("#ganhosCorpo"); if (!el) return;
  let total, horas, compara, barras, nomes, agora;
  if (periodoGanhos === "1m") { total = 412.5; horas = 38; compara = "+16% sobre setembro"; barras = GANHOS.semanas.map(s => s[1]); nomes = ["1ª sem","2ª sem","3ª sem","4ª sem"]; agora = 3; }
  else { const n = periodoGanhos === "3m" ? 3 : 6; const ms = GANHOS.meses.slice(-n-1, -1); total = ms.reduce((s,m) => s+m[1],0); horas = ms.reduce((s,m) => s+m[2],0); compara = periodoGanhos === "3m" ? "+31% sobre os 3 meses antes" : "6 meses seguidos com ganho"; barras = GANHOS.meses.slice(-n-1).map(m => m[1]); nomes = GANHOS.meses.slice(-n-1).map(m => m[0]); agora = barras.length - 1; }

}

  [1,"Comparação de Respostas e LLM como Juiz","curso-comparacao",0,"4 aulas"],[1,"Segurança, Red Teaming e Conteúdo Sensível","curso-seguranca",0,"4 aulas"],
  [2,"Avaliação de TTS: MOS, CMOS e as Escalas","curso-tts",0,"4 aulas"],[2,"Transcrição e Convenções","curso-transcricao",100,"Concluído"],[2,"Fonética Prática para Quem Avalia Voz","curso-fonetica",0,"4 aulas"]];

  <div class="cab"><div><h1 class="tit">Cursos</h1><p class="sub">Aprender o trabalho antes da primeira vaga. Seu progresso fica guardado na conta.</p></div></div>
  <div class="grade g-2">${[[1,"Avaliação e julgamento"],[2,"Voz e áudio"]].map(([t,n]) => `<section class="cartao"><div class="c-cab"><h2>Trilha ${t} · ${n}</h2></div><div style="display:grid;gap:10px">${CURSOS.filter(c => c[0]===t).map((c,i) => `<a class="curso-c" href="${SITE}${c[2]}.html" target="_blank" rel="noopener"><span class="capa${t===2?" voz":""}">${i+1}</span><div style="flex:1;min-width:0"><b>${c[1]}</b><small>${c[4]}${c[3]===100?" ✓":""}</small><div class="prog"><i style="width:${c[3]}%"></i></div></div></a>`).join("")}</div></section>`).join("")}</div>`;

const ferr = (icone, titulo, texto, botao, href, ext) => `<section class="cartao"><span class="qd">${ic(icone)}</span><h2 style="font-size:18px">${titulo}</h2><p>${texto}</p><a class="bt forte" href="${href}"${ext?' target="_blank" rel="noopener"':""}>${botao} ${ic("seta")}</a></section>`;
T.estudo = () => `<div class="cab"><div><h1 class="tit">Estudar uma diretriz</h1><p class="sub">Você sobe a diretriz do projeto e a IA vira o seu professor: ensina uma parte de cada vez, pergunta para ver se você entendeu e explica de outro jeito quando precisa.</p></div></div>
  <div class="ferr">${ferr("estudo","Diretriz do projeto (exemplo)","Parte 3 de 6. Na última vez você parou no caso prático da parte 2.","Continuar de onde parei","../estudo-diretriz.html")}
  <section class="cartao" style="border-style:dashed;background:var(--panel-2)"><span class="qd">${ic("mais")}</span><h2 style="font-size:18px">Estudar outra diretriz</h2><p>Arraste o PDF da diretriz do seu projeto. Ela fica só na sua conta.</p><a class="bt" href="../estudo-diretriz.html">Subir uma diretriz</a></section></div>`;
T.curriculo = () => `<div class="cab"><div><h1 class="tit">Avaliar currículo</h1><p class="sub">Escolha uma vaga, mande o seu currículo e veja a nota e o que ajustar, já escrito em inglês. A ferramenta usa o seu perfil profissional e nunca inventa nada.</p></div></div>
  <div class="ferr">${ferr("curriculo","Avaliar para uma vaga","Última avaliação: Portuguese AI Evaluation Specialist, nota 72. Três sugestões ainda abertas.","Abrir a ferramenta","../ferramenta-curriculo.html")}
  ${ferr("perfil","Seu perfil profissional","Quanto mais completo o perfil, melhores as sugestões. O seu está 85% preenchido.","Ver o perfil","#perfil")}</div>`;
T.transcricao = () => `<div class="cab"><div><h1 class="tit">Transcrição ao vivo</h1><p class="sub">Fale ou toque um áudio e veja o texto aparecer na hora, para treinar as convenções de transcrição.</p></div></div>
  <div class="ferr">${ferr("transcricao","Abrir a transcrição","Funciona no navegador, sem instalar nada. O texto não sai do seu computador.","Abrir",SITE + "transcricao.html",true)}
  ${ferr("cursos","Curso de transcrição","Verbatim contra limpo, hesitações, ruídos e números. Você já concluiu este curso.","Rever o curso",SITE + "curso-transcricao.html",true)}</div>`;

T.perfil = () => `<div class="cab"><div><h1 class="tit">Perfil profissional</h1><p class="sub">Só você vê o seu perfil. Ele escolhe as vagas de especialista para você e ajuda a ferramenta de currículo.</p></div><a class="bt forte" href="../perfil-profissional.html">Editar o perfil</a></div>
  <section class="cartao"><div class="secoes">
    <div class="ps"><h3>Idiomas</h3><ul><li class="tag az">Português · Nativo</li><li class="tag az">Inglês · C1 · TOEFL</li><li class="tag">Espanhol · B1</li></ul></div>
    <div class="ps"><h3>Onde mora e horas</h3><p>Brasil · 20 horas por semana, de preferência à noite</p></div>
    <div class="ps"><h3>Formação</h3><p>Licenciatura em Letras, Português e Inglês (concluída)</p></div>
    <div class="ps"><h3>Áreas</h3><ul><li class="tag">Linguística · 3 anos</li><li class="tag">Educação e Ensino · 5 anos</li></ul></div>
    <div class="ps"><h3>Experiências</h3><p>Personalized Internet Assessor na TELUS, desde setembro · Local Maps Search Evaluator na OneForma, desde outubro · Professora de inglês, 5 anos</p></div>
    <div class="ps"><h3>Ferramentas</h3><p style="color:var(--amber)">Ainda não preenchido</p></div>
  </div></section>`;
T.conta = () => `<div class="cab"><div><h1 class="tit">Minha conta</h1><p class="sub">Seus dados, os avisos que você recebe e o seu plano.</p></div></div>
  <div class="grade g-2"><section class="cartao"><div class="secoes">
    <div class="ps"><h3>Nome</h3><p>Marina Souza</p></div><div class="ps"><h3>E-mail</h3><p>marina@exemplo.com</p></div>
    <div class="ps"><h3>Plano</h3><p><span class="tag az">◆ Plano Pro</span></p></div><div class="ps"><h3>Meu perfil público</h3><p>Nome, apresentação e foto. <a class="link" href="#conta">Editar</a></p></div>
  </div></section>
  <section class="cartao"><div class="secoes">
    <div class="ps"><h3>Alerta de vagas</h3><p>Por e-mail, todo dia, só das suas áreas</p></div><div class="ps"><h3>Avisos</h3><p>Entrevistas e prazos da Agenda, um dia antes</p></div>
    <div class="ps"><h3>Seus dados</h3><p><a class="link" href="#conta">Baixar uma cópia</a> · <a class="link" href="#conta" style="color:var(--verm)">Apagar a conta</a></p></div>
  </div><a class="bt" href="../porta/entrar.html" style="margin-top:16px">${ic("sair")} Sair da conta</a></section></div>`;
T.equipe = () => `<div class="cab"><div><h1 class="tit">Painel da equipe</h1><p class="sub">Este item só aparece na coluna para quem é da equipe. Os alunos não veem.</p></div></div>
  <div class="ferr">${ferr("equipe","Abrir o painel","Visão geral, alunos, empresas, vagas e equipe, como no painel de hoje.","Abrir o painel","../painel.html")}</div>`;
T.alta = () => T.vagas(true);

const NOMES = { inicio:["Geral","Início"], vagas:["Geral","Vagas"], alta:["Geral","Em alta"], empresas:["Geral","Empresas"], candidaturas:["Meu Controle","Candidaturas"], trabalhos:["Meu Controle","Trabalhos e horas"], agenda:["Meu Controle","Agenda"], ganhos:["Meu Controle","Ganhos e imposto"], cursos:["Aprender","Cursos"], estudo:["Aprender","Estudar uma diretriz"], curriculo:["Ferramentas","Avaliar currículo"], transcricao:["Ferramentas","Transcrição ao vivo"], perfil:["Você","Perfil profissional"], conta:["Você","Minha conta"], equipe:["Equipe","Painel da equipe"] };

/* ───── navegação ───── */
function abrir(){
  let rota = (location.hash || "#inicio").slice(1).split("?")[0];
  if (!T[rota]) rota = "inicio";
  desenhaMenu(rota);
  $("#trilha span").textContent = NOMES[rota].join(" · ");
  document.title = NOMES[rota][1] + " · Home Office Hub";
  const tela = $("#tela");
  tela.classList.remove("entra"); void tela.offsetWidth; tela.classList.add("entra");
  catAtual = ""; buscaAtual = rota === "vagas" ? (sessionStorage.getItem("busca") || "") : ""; limite = 25;
  try { sessionStorage.removeItem("busca"); } catch(e) {}
  tela.innerHTML = T[rota]();
  if (rota === "inicio") { pintaGanhos(); pintaCand(); }
  if (rota === "vagas" || rota === "alta") { pintaTabela(rota === "alta"); const b = $("#buscaVagas"); if (b) b.value = buscaAtual; }
  fecharLado();
  window.scrollTo({ top: 0, behavior: "instant" });
}
window.addEventListener("hashchange", abrir);

document.addEventListener("click", ev => {
  const chip = ev.target.closest("[data-chips] button");
  if (chip) { const g = chip.parentElement.dataset.chips; chip.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === chip));
    if (g === "ganhos") { periodoGanhos = chip.dataset.k; pintaGanhos(); } else { periodoCand = chip.dataset.k; pintaCand(); } return; }
  const cat = ev.target.closest("#filtroCat button");
  if (cat) { catAtual = cat.dataset.k; limite = 25; cat.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === cat)); pintaTabela(false); return; }
  if (ev.target.closest("#maisVagas")) { limite += 25; pintaTabela(location.hash === "#alta"); return; }
  const empC = ev.target.closest("[data-emp]");
  if (empC) { try { sessionStorage.setItem("busca", emp(empC.dataset.emp).nome); } catch(e) {} location.hash = "#vagas"; return; }
  const vg = ev.target.closest("[data-vaga]");
  if (vg) { abrirVaga(vg.dataset.vaga); return; }
  const av = ev.target.closest("[data-aviso]");
  if (av) { avisar(av.dataset.aviso); return; }
  if (ev.target.closest("#novaCand")) { avisar("Abre o formulário de candidatura. Pelo botão da vaga, ela já vem preenchida."); return; }
  if (ev.target.closest("#veuGaveta") || ev.target.closest(".gv-cab .fechar")) { fecharVaga(); return; }
  if (ev.target.closest("#abrirLado")) { $("#lado").classList.add("on"); $("#veuLado").classList.add("on"); return; }
  if (ev.target.closest("#veuLado")) fecharLado();
});
document.addEventListener("input", ev => {
  if (ev.target.id === "buscaVagas") { buscaAtual = ev.target.value; limite = 25; pintaTabela(false); }
});
$("#buscaTopo").addEventListener("keydown", ev => {
  if (ev.key !== "Enter") return;
  try { sessionStorage.setItem("busca", ev.target.value); } catch(e) {}
  ev.target.value = "";
  if (location.hash === "#vagas") abrir(); else location.hash = "#vagas";
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") { fecharVaga(); fecharLado(); } });
function fecharLado(){ $("#lado").classList.remove("on"); $("#veuLado").classList.remove("on"); }
window.addEventListener("scroll", () => $("#topo").classList.toggle("rolou", scrollY > 8), { passive:true });

let avisoT;
function avisar(t){ const a = $("#aviso"); a.textContent = t; a.classList.add("on"); clearTimeout(avisoT); avisoT = setTimeout(() => a.classList.remove("on"), 3200); }

function abrirVaga(id){
  const v = vagaPorId(id); if (!v) return;
  const c = CANDS.find(x => x.vaga === id);
  const tags = [v.pag, v.carga, v.contrato, IDIOMA[v.idioma] || v.idioma].filter(Boolean);
  $("#gaveta").innerHTML = `<div class="gv-cab">${logoDe(v.empresa)}<div><b style="color:var(--ink);font-size:14px">${esc(emp(v.empresa).nome)}</b><br><small style="font-size:12px;color:var(--ink-3)">${v.reab ? "Reaberta" : "Publicada"} ${quando(v.data)}</small></div><button class="fechar" aria-label="Fechar">${ic("fechar")}</button></div>
  <div class="gv-corpo">${emAlta(v) ? '<span class="selo-alta" style="margin-bottom:10px">Contratando com frequência</span>' : ""}<h2>${esc(v.titulo)}</h2>${v.frase ? `<p class="frase">${esc(v.frase)}</p>` : ""}
  <div class="gv-tags">${tags.map(t => `<span class="tag az">${esc(t)}</span>`).join("")}</div>
  ${c ? `<div class="kc" style="cursor:default;margin-top:14px"><b>Você se candidatou</b><div class="passos">${ETAPAS.map((e,j) => `<i class="${j <= ETAPAS.findIndex(x => x[0]===c.etapa) ? "f" : ""}"></i>`).join("")}</div>${c.prox ? `<div class="prox">${esc(c.prox)}</div>` : ""}</div>` : ""}
  ${v.o_que_faz ? `<h3>O que você vai fazer</h3><p>${esc(v.o_que_faz)}</p>` : ""}${v.requisitos ? `<h3>Requisitos</h3><p>${esc(v.requisitos)}</p>` : ""}
  ${!v.o_que_faz && !v.requisitos ? `<p style="margin-top:18px">A equipe ainda não resumiu esta vaga. O anúncio oficial tem todos os detalhes.</p>` : ""}</div>
  <div class="gv-pe"><a class="bt forte" href="${esc(v.url)}" target="_blank" rel="noopener">Ver o anúncio oficial ${ic("externo")}</a>${c ? "" : `<button class="bt" id="marcarAqui">${ic("ok")} Já me candidatei</button>`}<a class="bt" href="../ferramenta-curriculo.html?vaga=${encodeURIComponent(v.id)}">Avaliar meu currículo</a></div>`;
  $("#gaveta").classList.add("on"); $("#gaveta").setAttribute("aria-hidden","false"); $("#veuGaveta").classList.add("on");
  const m = $("#marcarAqui");
  if (m) m.addEventListener("click", () => { CANDS.unshift({ vaga:id, etapa:"enviado", desde:0, prox:"Acabou de se candidatar" }); desenhaMenu((location.hash||"#inicio").slice(1)); abrirVaga(id); avisar("Guardada em Candidaturas, na etapa Currículo enviado."); });
}
function fecharVaga(){ $("#gaveta").classList.remove("on"); $("#gaveta").setAttribute("aria-hidden","true"); $("#veuGaveta").classList.remove("on"); }

/* dólar de verdade do Banco Central, quando responder */
(async function(){
  try {
    const f = d => `${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}-${d.getFullYear()}`;
    const u = "https://olinda.bcb.gov.br/olinda/servico/PTAX/versao/v1/odata/CotacaoDolarPeriodo(dataInicial=@i,dataFinalCotacao=@f)?@i='" + f(dia(-10)) + "'&@f='" + f(HOJE) + "'&$format=json&$select=cotacaoCompra,dataHoraCotacao";
    const r = await fetch(u); const j = await r.json(); const ult = j.value && j.value[j.value.length-1];
    if (!ult) return;
    DOLAR = { v: ult.cotacaoCompra, quando: ult.dataHoraCotacao };
    const el = $("#dolarValor"); if (el) { el.textContent = fmtR(DOLAR.v); $("#dolarMes").textContent = fmtR(412.5*DOLAR.v); $("#dolarFonte").textContent = "Banco Central · " + DOLAR.quando.slice(8,10) + "/" + DOLAR.quando.slice(5,7); }
  } catch(e) {}
})();

pintaIcones();
abrir();
})();
</script>
